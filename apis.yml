apis:
- aid: formstack:forms
  name: Formstack Forms API
  description: >-
    REST API for creating, reading, updating, and deleting forms in a Formstack account, including form
    configuration, styling, and access rules.
  humanURL: https://developers.formstack.com/reference/api-overview
  baseURL: https://www.formstack.com/api/v2
  tags:
  - Forms
  - REST
  properties:
  - type: Documentation
    url: https://developers.formstack.com/reference/api-overview
- aid: formstack:submissions
  name: Formstack Submissions API
  description: >-
    Read, create, update, and delete form submissions; supports filtering by date, search, and field values.
    Returns submitted field data and metadata.
  humanURL: https://developers.formstack.com/reference/api-overview
  baseURL: https://www.formstack.com/api/v2
  tags:
  - Submissions
  - Data
  properties:
  - type: Documentation
    url: https://developers.formstack.com/reference/api-overview
- aid: formstack:fields
  name: Formstack Fields API
  description: >-
    Programmatically manage form fields - text, select, file upload, signature, payment, calculation,
    and others - including ordering, validation, and conditional logic.
  humanURL: https://developers.formstack.com/reference/api-overview
  baseURL: https://www.formstack.com/api/v2
  tags:
  - Fields
  - Form Schema
  properties:
  - type: Documentation
    url: https://developers.formstack.com/reference/api-overview
- aid: formstack:webhooks
  name: Formstack Webhooks API
  description: >-
    Configure webhook subscriptions to receive submission events at a customer-provided URL, with retry
    semantics for failed deliveries.
  humanURL: https://developers.formstack.com/reference/api-overview
  baseURL: https://www.formstack.com/api/v2
  tags:
  - Webhook
  - Event
  tags_raw:
